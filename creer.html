<!DOCTYPE html>
<html lang="fr">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-5P9NMJ49"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-SSS4EVD5M4');
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proposer une carte – Wikimaster CentraleSupélec</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="config.js"></script>
<script src="wm.js"></script>
</head>
<body>
<main>
  <div id="top"></div>
  <h1>Proposer une carte</h1>
  <p class="lead">Crée une carte du campus : un lieu, une salle, une asso… Elle sera vérifiée avant d’apparaître dans les boosters, et sa rareté pourra être ajustée.</p>
  <div id="auth"></div>
  <div id="wrap" style="display:none;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start">
    <form id="f" class="box" style="max-width:none">
      <label>Nom<input id="name" maxlength="40" required></label>
      <label>Description<textarea id="desc" maxlength="300" rows="3" required></textarea></label>
      <label>Catégorie<select id="cat"></select></label>
      <label>Rareté proposée<select id="rar"></select></label>
      <label>Photo<input id="file" type="file" accept="image/*" required></label>
      <button id="send" type="submit">Envoyer la carte</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <div id="prev" style="max-width:260px"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id), { RAR, CATS } = WM;
let blob = null, url = null;
Object.entries(CATS).forEach(([k, v]) => $("cat").append(new Option(v, k)));
Object.entries(RAR).forEach(([k, v]) => $("rar").append(new Option(v[0], k)));

function preview() {
  $("prev").textContent = "";
  $("prev").append(WM.cardEl({ name: $("name").value || "Nom de la carte", description: $("desc").value || "Description de la carte", category: $("cat").value, rarity: $("rar").value, url, emoji: "📷" }));
}
["name", "desc", "cat", "rar"].forEach((id) => $(id).addEventListener("input", preview));

// Réduit la photo et la ré-encode en JPEG (retire aussi les données EXIF)
async function compress(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  let k = Math.min(1, 1200 / Math.max(bmp.width, bmp.height)), q = 0.82;
  for (let i = 0; ; i++) {
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise((r) => c.toBlob(r, "image/jpeg", q));
    if (b.size <= 1400000 || i >= 4) return b;
    q = Math.max(0.5, q - 0.1); k *= 0.85;
  }
}

$("file").onchange = async (e) => {
  blob = null; url = null;
  if (e.target.files[0]) {
    try { blob = await compress(e.target.files[0]); url = URL.createObjectURL(blob); }
    catch { $("msg").textContent = "Format d’image non lu. Essaie une photo JPEG ou PNG."; }
  }
  preview();
};

$("f").onsubmit = async (e) => {
  e.preventDefault();
  if (!blob) return ($("msg").textContent = "Choisis une photo.");
  $("send").disabled = true; $("msg").style.color = ""; $("msg").textContent = "Envoi en cours…";
  try {
    const path = crypto.randomUUID() + ".jpg";
    let r = await WM.api("/storage/v1/object/cards/" + path, { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
    if (!r.ok) throw new Error("envoi de l’image refusé (" + r.status + ")");
    r = await WM.api("/rest/v1/cards", {
      method: "POST", headers: { "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ name: $("name").value.trim(), description: $("desc").value.trim(), category: $("cat").value, rarity: $("rar").value, path })
    });
    if (!r.ok) throw new Error("enregistrement de la carte refusé (" + r.status + ")");
    $("msg").style.color = "#7fe0ae"; $("msg").textContent = "Carte envoyée, merci ! Elle apparaîtra après validation.";
    $("f").reset(); blob = url = null; preview();
  } catch (err) { $("msg").style.color = "#ff8f86"; $("msg").textContent = "Échec : " + err.message; }
  $("send").disabled = false;
};

async function init() {
  await WM.header($("top"));
  $("auth").textContent = "";
  const logged = !!WM.user();
  $("wrap").style.display = logged ? "grid" : "none";
  if (logged) preview(); else $("auth").append(WM.authBox(init));
}
init();
</script>
</body>
</html>
