<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Modération – Wikimaster CentraleSupélec</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="config.js"></script>
<script src="wm.js"></script>
<style>
  dialog{background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1rem;width:min(440px,94vw)}
  dialog::backdrop{background:rgba(0,0,0,.65)}
  dialog .box{padding:0;background:none;max-width:none}
</style>
</head>
<body>
<main>
  <a href="index.html">Retour au jeu</a>
  <h1>Modération des cartes</h1>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <div id="auth"></div>
  <section id="panel" hidden>
    <div class="acts" style="margin:0 0 1rem">
      <button id="tabP" type="button">En attente</button>
      <button id="tabA" class="ghost" type="button">Validées</button>
      <input id="q" type="search" placeholder="Rechercher une carte…" aria-label="Rechercher une carte" style="max-width:240px">
      <button id="out" class="ghost" type="button">Se déconnecter</button>
    </div>
    <div class="grid" id="list"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id), { h, RAR, CATS } = WM;
let view = "pending";

function setView(v) {
  view = v;
  $("tabP").className = v === "pending" ? "" : "ghost";
  $("tabA").className = v === "approved" ? "" : "ghost";
  load();
}
$("tabP").onclick = () => setView("pending");
$("tabA").onclick = () => setView("approved");
let timer; $("q").oninput = () => { clearTimeout(timer); timer = setTimeout(load, 300); };
$("out").onclick = () => { try { localStorage.removeItem("wm_s"); } catch {} location.reload(); };

async function load() {
  $("list").textContent = ""; $("msg").style.color = ""; $("msg").textContent = "Chargement…";
  try {
    const term = $("q").value.trim().replace(/[*,()%]/g, "");
    const rows = await WM.json("/rest/v1/cards?select=*&approved=eq." + (view === "approved") + (term ? "&name=ilike.*" + encodeURIComponent(term) + "*" : "") + "&order=created_at.asc,name.asc&limit=60");
    $("msg").textContent = rows.length === 60 ? "60 premières cartes affichées : utilise la recherche pour trouver les autres." : rows.length ? "" : "Aucune carte trouvée.";
    rows.forEach(add);
  } catch (e) { $("msg").textContent = "Chargement impossible : " + e.message; }
}

function add(c) {
  const w = h("div"), acts = h("div", "acts"), det = h("dialog"), form = h("div", "box");
  form.style.maxWidth = "none";
  const nm = h("input"), ds = h("textarea"), ct = h("select"), rr = h("select"), fl = h("input");
  nm.value = c.name; nm.maxLength = 40; nm.ariaLabel = "Nom";
  ds.value = c.description; ds.maxLength = 300; ds.rows = 3; ds.ariaLabel = "Description";
  Object.entries(CATS).forEach(([k, v]) => ct.append(new Option(v, k, false, k === c.category))); ct.ariaLabel = "Catégorie";
  Object.entries(RAR).forEach(([k, v]) => rr.append(new Option(v[0], k, false, k === c.rarity))); rr.ariaLabel = "Rareté";
  fl.type = "file"; fl.accept = "image/*"; fl.ariaLabel = "Nouvelle photo";
  const fields = () => ({ name: nm.value.trim(), description: ds.value.trim(), category: ct.value, rarity: rr.value });

  const run = (fn) => async () => { try { await fn(); } catch (e) { $("msg").style.color = "#ff8f86"; $("msg").textContent = "Échec : " + e.message; } };
  const btn = (t, cls, fn) => { const b = h("button", cls, t); b.type = "button"; b.onclick = run(fn); return b; };
  const patch = async (body) => {
    const r = await WM.json("/rest/v1/cards?id=eq." + c.id, { method: "PATCH", headers: { "Content-Type": "application/json", Prefer: "return=representation" }, body: JSON.stringify(body) });
    if (!r.length) throw new Error("aucune ligne modifiée (wikimaster.sql exécuté avec la bonne adresse e-mail ?)");
  };
  const del = async () => {
    if (!confirm("Supprimer définitivement cette carte ?")) return;
    const r = await WM.json("/rest/v1/cards?id=eq." + c.id, { method: "DELETE", headers: { Prefer: "return=representation" } });
    if (!r.length) throw new Error("aucune ligne supprimée");
    if (c.path) await WM.api("/storage/v1/object/cards/" + encodeURIComponent(c.path), { method: "DELETE" });
    w.remove();
  };
  // Enregistre les champs, et remplace la photo si une nouvelle a été choisie
  const save = async (extra) => {
    const body = { ...fields(), ...extra }; let old = null;
    if (fl.files[0]) {
      const blob = await WM.compress(fl.files[0]), path = crypto.randomUUID() + ".jpg";
      const r = await WM.api("/storage/v1/object/cards/" + path, { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
      if (!r.ok) throw new Error("envoi de la photo refusé (" + r.status + ")");
      old = c.path; body.path = path;
    }
    await patch(body);
    if (old) await WM.api("/storage/v1/object/cards/" + encodeURIComponent(old), { method: "DELETE" });
  };

  form.append(nm, ds, ct, rr, h("small", "", "Nouvelle photo (facultatif)"), fl,
    btn("Enregistrer les modifications", "", async () => { await save({}); det.close(); await load(); $("msg").style.color = "#7fe0ae"; $("msg").textContent = "Carte mise à jour."; }));
  const close = btn("Fermer", "ghost", () => det.close());
  det.append(h("h2", "", c.name), form, close);

  acts.append(btn("Modifier", "ghost", () => det.showModal()));
  if (view === "pending") acts.append(btn("Valider", "good", async () => { await save({ approved: true }); await load(); }), btn("Refuser", "bad", del));
  else acts.append(btn("Retirer du jeu", "bad", del));

  w.append(WM.cardEl(c), acts, det);
  $("list").append(w);
}

function init() {
  $("auth").textContent = "";
  const logged = !!WM.user();
  $("panel").hidden = !logged;
  if (logged) { $("out").textContent = "Se déconnecter (" + WM.user().email + ")"; load(); } else $("auth").append(WM.authBox(init, true));
}
init();
</script>
</body>
</html>
